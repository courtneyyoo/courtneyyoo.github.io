<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <script>
    // The 4PM demo is a single-page app: send its inner pages back to the demo's start.
    if (location.pathname.startsWith("/4pm-demo/")) location.replace("/4pm-demo/");
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.6 system-ui, sans-serif; background: #faf7f2; color: #1d1b19; text-align: center; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #151412; color: #f1ece5; } }
    a { color: #d9622b; }
  </style>
</head>
<body>
  <div><h1>Page not found</h1><p><a href="/">Back to the portfolio</a></p></div>
</body>
</html>
